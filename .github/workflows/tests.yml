name: Automated Regression Tests

on:
  # Odpalanie cykliczne (np. codziennie o 2:00 w nocy czasu UTC)
  schedule:
    - cron: '0 2 * * *'
  
  # Przycisk do ręcznego odpalania z panelu GitHub
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Uruchom testy Maven (Headless)
        run: mvn clean test

      - name: Zapisz raport Allure jako artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

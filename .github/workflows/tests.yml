name: Automated Regression Tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Uruchom testy Maven (Headless)
        run: mvn clean test
        continue-on-error: true

      - name: Zainstaluj Allure CLI
        if: always()
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -zxvf allure-2.24.0.tgz
          sudo mv allure-2.24.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/usr/bin/allure || sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Wygeneruj raport HTML z wyników
        if: always()
        run: allure generate target/allure-results --clean -o allure-report

      - name: Przesłanie raportu do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: allure-report

  deploy-report:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Publikacja na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

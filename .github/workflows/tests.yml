name: Automated Regression Tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Nadajemy uprawnienia do publikacji strony GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Uruchom testy Maven (Headless)
        run: mvn clean test
        continue-on-error: true # Pozwala przejść dalej, nawet gdy testy spaliły (błędy w assertion)

      - name: Pobierz historię poprzednich raportów Allure
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Wygeneruj raport Allure HTML
        uses: simple-elf/allure-report-action@v1.11
        if: always()
        with:
          allure_results: target/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Przesłanie raportu do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: allure-history

  deploy-report:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Publikacja na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
